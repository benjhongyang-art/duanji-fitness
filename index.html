<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f0e8" id="theme-color" />
    <meta name="description" content="鍛記：離線可用的訓練紀錄。課表、組數、休息計時與進步曲線都留在這台裝置。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="鍛記" />
    <title>鍛記</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("duanji-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = theme === "dark" || ((theme === "system" || !theme) && systemDark);
          if (theme === "light") dark = false;
          if (dark) document.documentElement.classList.add("dark");
          var meta = document.getElementById("theme-color");
          if (meta) meta.setAttribute("content", dark ? "#100f0d" : "#f3f0e8");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 24px">鍛記需要開啟 JavaScript 才能把訓練留在這台裝置上。</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
